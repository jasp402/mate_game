<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Sky Gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#6366f1" />
      <stop offset="70%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Hill Gradients -->
    <linearGradient id="hillBackGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="hillFrontGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>

    <!-- Rainbow Gradient -->
    <linearGradient id="rainbowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="20%" stop-color="#f97316" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="60%" stop-color="#22c55e" />
      <stop offset="80%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="1080" height="1920" fill="url(#skyGrad)" />

  <!-- Clouds with Numbers -->
  <g opacity="0.95">
    <!-- Cloud 1 (Left) -->
    <path d="M 120 220 Q 120 170 170 170 Q 200 130 250 150 Q 300 130 330 170 Q 370 170 370 220 Q 370 260 320 260 L 170 260 Q 120 260 120 220 Z" fill="#ffffff" opacity="0.9" />
    <text x="245" y="225" font-family="system-ui, sans-serif" font-weight="900" font-size="64" fill="#3b82f6" text-anchor="middle">5</text>
    <polygon points="310,170 315,182 328,182 317,190 321,202 310,194 299,202 303,190 292,182 305,182" fill="#f59e0b" />

    <!-- Cloud 2 (Right) -->
    <path d="M 720 180 Q 720 130 770 130 Q 800 90 850 110 Q 900 90 930 130 Q 970 130 970 180 Q 970 220 920 220 L 770 220 Q 720 220 720 180 Z" fill="#ffffff" opacity="0.95" />
    <text x="845" y="185" font-family="system-ui, sans-serif" font-weight="900" font-size="60" fill="#06b6d4" text-anchor="middle">8</text>

    <!-- Cloud 3 (Center High) -->
    <path d="M 450 120 Q 450 80 490 80 Q 520 50 560 65 Q 600 50 630 80 Q 660 80 660 120 L 490 120 Z" fill="#ffffff" opacity="0.8" />
    <text x="555" y="110" font-family="system-ui, sans-serif" font-weight="900" font-size="44" fill="#8b5cf6" text-anchor="middle">3</text>
  </g>

  <!-- Glowing Floating Math Symbols -->
  <g filter="url(#glow)">
    <text x="280" y="420" font-family="sans-serif" font-weight="900" font-size="90" fill="#fbbf24" text-anchor="middle">+</text>
    <text x="440" y="440" font-family="sans-serif" font-weight="900" font-size="80" fill="#f43f5e" text-anchor="middle">−</text>
    <text x="350" y="550" font-family="sans-serif" font-weight="900" font-size="85" fill="#a855f7" text-anchor="middle">×</text>
    <text x="500" y="560" font-family="sans-serif" font-weight="900" font-size="80" fill="#fb923c" text-anchor="middle">÷</text>
  </g>

  <!-- Rainbow Arc in background -->
  <path d="M 600 900 A 250 250 0 0 1 1020 900" fill="none" stroke="url(#rainbowGrad)" stroke-width="36" opacity="0.8" />

  <!-- Background Hills -->
  <path d="M -50 1100 Q 250 800 600 950 Q 900 1100 1130 900 L 1130 1950 L -50 1950 Z" fill="url(#hillBackGrad)" />

  <!-- Math Castle Silhouette on Hill -->
  <g transform="translate(680, 620) scale(1.1)">
    <!-- Base & Towers -->
    <rect x="40" y="160" width="120" height="120" rx="10" fill="#a855f7" />
    <rect x="10" y="120" width="40" height="160" rx="6" fill="#ec4899" />
    <rect x="150" y="120" width="40" height="160" rx="6" fill="#3b82f6" />
    <!-- Cone Roofs -->
    <polygon points="10,120 30,50 50,120" fill="#3b82f6" />
    <polygon points="150,120 170,50 190,120" fill="#ef4444" />
    <polygon points="70,160 100,80 130,160" fill="#f59e0b" />
    <!-- Flags -->
    <line x1="100" y1="80" x2="100" y2="40" stroke="#f59e0b" stroke-width="4" />
    <polygon points="100,40 140,50 100,60" fill="#ef4444" />
    <!-- Door -->
    <path d="M 80 280 L 80 220 Q 100 200 120 220 L 120 280 Z" fill="#475569" />
    <text x="100" y="180" font-family="sans-serif" font-weight="900" font-size="32" fill="#ffffff" text-anchor="middle">M</text>
  </g>

  <!-- Foreground Hills -->
  <path d="M -50 1300 Q 300 1150 700 1250 Q 950 1200 1130 1350 L 1130 1950 L -50 1950 Z" fill="url(#hillFrontGrad)" />

  <!-- Winding Path with Numbered Steps -->
  <g fill="none" stroke-linecap="round">
    <path d="M 200 1920 C 350 1700, 750 1600, 600 1400 C 480 1250, 300 1150, 500 1000 C 600 920, 750 850, 800 780" stroke="#fde047" stroke-width="120" opacity="0.25" />
  </g>

  <!-- Individual Colorful Path Tiles with Numbers -->
  <g font-family="system-ui, sans-serif" font-weight="900" font-size="52" text-anchor="middle">
    <!-- Tile 1 -->
    <rect x="580" y="1720" width="160" height="90" rx="20" fill="#3b82f6" transform="rotate(-12, 660, 1765)" />
    <text x="660" y="1780" fill="#ffffff" transform="rotate(-12, 660, 1765)">1</text>

    <!-- Tile 2 -->
    <rect x="420" y="1580" width="150" height="85" rx="20" fill="#22c55e" transform="rotate(-5, 495, 1620)" />
    <text x="495" y="1638" fill="#ffffff" transform="rotate(-5, 495, 1620)">2</text>

    <!-- Tile 3 -->
    <rect x="250" y="1460" width="140" height="80" rx="20" fill="#eab308" transform="rotate(10, 320, 1500)" />
    <text x="320" y="1515" fill="#ffffff" transform="rotate(10, 320, 1500)">3</text>

    <!-- Tile 5 -->
    <rect x="280" y="1320" width="130" height="75" rx="18" fill="#ec4899" transform="rotate(15, 345, 1355)" />
    <text x="345" y="1372" fill="#ffffff" transform="rotate(15, 345, 1355)">5</text>

    <!-- Tile 6 -->
    <rect x="440" y="1220" width="120" height="70" rx="16" fill="#a855f7" transform="rotate(-8, 500, 1255)" />
    <text x="500" y="1270" fill="#ffffff" transform="rotate(-8, 500, 1255)">6</text>

    <!-- Tile 7 -->
    <rect x="580" y="1130" width="110" height="65" rx="15" fill="#06b6d4" transform="rotate(-15, 635, 1160)" />
    <text x="635" y="1175" fill="#ffffff" transform="rotate(-15, 635, 1160)">7</text>
  </g>

  <!-- Big Glowing '7' Floating near Path -->
  <text x="820" y="1060" font-family="sans-serif" font-weight="900" font-size="140" fill="#c084fc" filter="url(#glow)">7</text>

  <!-- Flowers and Trees along Bottom -->
  <g opacity="0.9">
    <circle cx="120" cy="1780" r="22" fill="#f43f5e" />
    <circle cx="120" cy="1780" r="10" fill="#fef08a" />
    
    <circle cx="200" cy="1830" r="18" fill="#a855f7" />
    <circle cx="200" cy="1830" r="8" fill="#fef08a" />

    <circle cx="940" cy="1750" r="24" fill="#fb923c" />
    <circle cx="940" cy="1750" r="10" fill="#ffffff" />
  </g>
</svg>
